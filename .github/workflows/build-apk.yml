name: Build MusicBridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🚀 Android APK Derleme
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kurulumu (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 8.5 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Android APK'yi Derle
      working-directory: Android-MicroShell
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: APK Dosyasini Yayina Hazirla
      run: |
        mkdir -p release-output
        cp Android-MicroShell/app/build/outputs/apk/debug/app-debug.apk release-output/MusicBridge-v2.0.0.apk

    - name: APK Dosyasini Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: MusicBridge-v2.0.0-APK
        path: release-output/MusicBridge-v2.0.0.apk
        retention-days: 30

    - name: 🚀 GitHub Release Olarak Yayinla
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.0.0
        name: "🎵 MusicBridge v2.0.0 (LTS)"
        body: |
          ## ✨ MusicBridge v2.0.0 Yenilikleri & Güncelleme Notları
          * 🔍 **Sıfır-Konfigürasyon Otomatik Ağ Keşfi (UDP Discovery):** IP yazma zorunluluğu kalktı; telefon ağdaki PC'yi otomatik keşfeder.
          * 📞 **Akıllı Çağrı Duraklatma (Smart Auto-Pause):** Telefona arama geldiğinde PC'deki müziği otomatik duraklatır, görüşme bitince devam ettirir.
          * 🎤 **Canlı Senkronize Şarkı Sözleri (Lyrics Engine):** LRCLIB API entegrasyonu ile karaoke tarzı anlık kayan şarkı sözleri.
          * 📱 **Genişletilmiş Oynatıcı Desteği:** ReVanced, ViMusic, RiMusic, InnerTune, YouTube Music desteği.
          * ⚡ **Performans ve Pil Tasarrufu:** %80 CPU ve I/O yükü azaltıldı, akıllı arka plan bekleme motoru.
          * 🛡️ **Android 14 & 15 Uyumu:** `targetSdk 34` ve modern bildirim kontrolleri (Android 8.0 - 9.0 tam uyumu korundu).
        files: release-output/MusicBridge-v2.0.0.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
