name: Build MusicBridge APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build-and-release
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Android APK Derleme
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kurulumu (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 8.5 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Android APK'yi Derle
      working-directory: Android-MicroShell
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: APK Dosyasini Yayina Hazirla
      run: |
        mkdir -p release-output
        cp Android-MicroShell/app/build/outputs/apk/debug/app-debug.apk release-output/MusicBridge-v2.1.1.apk

    - name: APK Dosyasini Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: MusicBridge-v2.1.1-APK
        path: release-output/MusicBridge-v2.1.1.apk
        retention-days: 30

    - name: 🚀 GitHub Release Olarak Yayinla
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.1
        name: "🎵 MusicBridge v2.1.1 (LTS)"
        body: |
          ## ✨ MusicBridge v2.1.1 Güncelleme Notları
          * 🛡️ **Google Play Protect & Gizlilik Optimizasyonu:** `READ_PHONE_STATE` izni tamamen kaldırıldı; Google Play Protect uyarıları engellendi.
          * 📞 **Gelişmiş Sıfır-İzin Ses Odağı (Audio Focus):** Hem normal hücresel aramalar (GSM) hem de WhatsApp, Telegram, Discord VoIP aramalarında sıfır izinle otomatik duraklatma ve geri devam etme.
          * 📑 **Kuyruk Atlama & Şarkı Değiştirme Çözümü:** YouTube ve YouTube Music çalma listelerinde istenen şarkıya tıklandığında anında o videoya geçme mekanizması (çift tıklama ve doğrudan navigasyon desteği).
          * ⏭️ **Sıradaki Parça Otomatik Geçişi:** Şarkı bittiğinde belirlenen sıradaki şarkıya 0 gecikmeyle otomatik atlama (`video.addEventListener` timeupdate/ended).
          * 🖥️ **Windows Sistem Tepsisi (Tray) Düzeltmesi:** PowerShell Türkçe dil kodlamasında simge çökmesine yol açan karakterler temizlendi.
          * 🌐 **Sessiz Tarayıcı Eklentisi:** PC Core kapalıyken Chrome'da hata günlüğü birikmesini önleyen sessiz sağlık kontrolü.
        files: release-output/MusicBridge-v2.1.1.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
