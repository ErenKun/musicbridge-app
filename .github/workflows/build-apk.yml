name: Build MusicBridge APK

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-build-and-release
  cancel-in-progress: true

jobs:
  build:
    name: 🚀 Android APK Derleme
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kurulumu (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 8.5 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Android APK'yi Derle
      working-directory: Android-MicroShell
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: APK Dosyasini Yayina Hazirla
      run: |
        mkdir -p release-output
        cp Android-MicroShell/app/build/outputs/apk/debug/app-debug.apk release-output/MusicBridge-v2.1.0.apk

    - name: APK Dosyasini Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: MusicBridge-v2.1.0-APK
        path: release-output/MusicBridge-v2.1.0.apk
        retention-days: 30

    - name: 🚀 GitHub Release Olarak Yayinla
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v2.1.0
        name: "🎵 MusicBridge v2.1.0 (LTS)"
        body: |
          ## ✨ MusicBridge v2.1.0 Yenilikleri & Güncelleme Notları
          * 🔐 **Zero-Trust PIN Doğrulaması:** 6 haneli dinamik veya kullanıcının belirlediği kalıcı sabit PIN (Salted SHA-256 HMAC & Bearer Token koruması).
          * 🔄 **Çift Yönlü PIN Yönetimi & Sıfırlama:** Hem PC Sistem Tepsisi (Tray) menüsünden hem de mobil arayüzden PIN değiştirme, sabitleme ve sıfırlama.
          * 🔊 **Android Hızlı Ayarlar Kutucuğu (Quick Settings Tile):** Telefon bildirim çekmecesinden tek tıkla donanım ses senkronizasyonunu açıp kapatabilme (`MusicBridgeTileService`).
          * 🎛️ **Gelişmiş Ses Senkronizasyon Kontrolleri:** Sürekli bildirimdeki tek tık eylem butonu (`[ 🔊 Ses Senkronu: Açık/Kapalı ]`) ve mobil arayüz menüsündeki özel anahtar.
          * 🖥️ **Windows Sistem Tepsisi (Tray) Kararlılığı:** Otomatik başlangıçta tepsi simgesinin gecikmesiz yüklenmesi, PIN gösterimi, IP ve QR menüleri.
          * 📑 **YouTube Oynatma Listesi & Sıradaki Şarkılar Denetleyicisi:** Chrome eklentisi üzerinden YouTube listesindeki sonraki parçaları mobil ekranda görüp doğrudan atlayabilme.
          * 🎵 **YouTube Music / Musixmatch Entegre Söz Motoru:** LRCLIB yanında web player DOM'undan senkronize şarkı sözü aktarımı.
          * ⚡ **Kararlılık ve Güvenilirlik:** Xiaomi MIUI/HyperOS ve Samsung OneUI pil optimizasyonlarına karşı güçlendirilmiş `MediaSessionCompat` mimarisi.
        files: release-output/MusicBridge-v2.1.0.apk
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
