name: Build MusicBridge APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: 🚀 Android APK Derleme
    runs-on: ubuntu-latest

    steps:
    - name: Depoyu Klonla
      uses: actions/checkout@v4

    - name: Java 17 Kurulumu (Temurin)
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Gradle 8.5 Kurulumu
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: 8.5

    - name: Android APK'yi Derle
      working-directory: Android-MicroShell
      run: |
        gradle wrapper --gradle-version 8.5
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon --stacktrace

    - name: APK Dosyasini Yayina Hazirla
      run: |
        mkdir -p release-output
        cp Android-MicroShell/app/build/outputs/apk/debug/app-debug.apk release-output/MusicBridge-v1.0.0.apk

    - name: APK Dosyasini Artifact Olarak Yukle
      uses: actions/upload-artifact@v4
      with:
        name: MusicBridge-v1.0.0-APK
        path: release-output/MusicBridge-v1.0.0.apk
        retention-days: 30
